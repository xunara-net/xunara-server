// Xunara Platform API v2 over gRPC (M8d, M8e).
//
// PlatformService mirrors the read-mostly /api/v2 surface of one organization
// so automation can use a typed protocol instead of scraping JSON. It is part
// of the platform plane: it never touches the Tailscale compatibility core
// (TS2021, Noise, MapRequest), and credentials are the same service API keys
// the HTTP API accepts.
//
// PlatformAdminService mirrors /api/platform/v1, the deployment-level surface
// a multi-tenant operator automates. It accepts only the process-level
// platform admin token.
//
// In a multi-tenant deployment the organization for PlatformService is chosen
// by the gRPC authority (":authority"), the HTTP/2 equivalent of the Host
// header, so one listener serves every organization exactly like the HTTP
// router does. PlatformAdminService is deployment-scoped and ignores the
// authority.

// Regenerate from the repository root (protoc + protoc-gen-go, and
// protoc-gen-go-grpc on PATH; the include path must contain the well-known
// types imported below):
//
//	protoc -I api/proto --go_out=api/gen --go_opt=paths=source_relative \
//	  --go-grpc_out=api/gen --go-grpc_opt=paths=source_relative \
//	  api/proto/xunara/v2/platform.proto

syntax = "proto3";

package xunara.v2;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/xunara-net/xunara-server/api/gen/xunara/v2;xunarav2";

// PlatformService is the organization-scoped automation surface.
service PlatformService {
  // GetMeta reports what this control plane is and which optional features
  // are configured. It never returns secrets or key material.
  rpc GetMeta(GetMetaRequest) returns (Meta);

  // GetOrganizationIdentity reports the identity of the organization this
  // call addresses (GET /api/v2/organization): its platform ID, name, routing
  // domains and whether the platform registry manages it. The organization is
  // chosen by the authority, so the request carries no ID and another
  // organization's identity cannot be requested. A single-tenant deployment
  // has no platform identity: id and name are empty.
  rpc GetOrganizationIdentity(GetOrganizationIdentityRequest) returns (OrganizationIdentity);

  // GetTailnetLock reports the state of the tailnet key authority (tailnet
  // lock): whether it is enabled, the current chain head, and how many nodes
  // carry a node-key signature. It never returns the AUM chain contents, the
  // trusted key material, or the sealed disablement secret.
  rpc GetTailnetLock(GetTailnetLockRequest) returns (TailnetLockStatus);

  // GetIDTokenIssuer reports the OIDC identity-token issuer this control
  // plane exposes to nodes (POST /machine/id-token) and the public signing
  // keys a relying party verifies tokens with. It never returns private key
  // material.
  rpc GetIDTokenIssuer(GetIDTokenIssuerRequest) returns (IDTokenIssuerStatus);

  // GetDERPStatus reports which DERP regions this organization serves its
  // clients and where its machines are homed (GET /api/v2/derp). The policy
  // itself is configuration: this surface is read-only. Relay host names are
  // public netmap information; no secret is returned.
  rpc GetDERPStatus(GetDERPStatusRequest) returns (DERPStatus);

  // GetPolicyStatus reports the ACL document this organization is enforcing
  // (Xunara Warden) and the outcome of the document's own tests against the
  // current machines (GET /api/v2/policy). The document is loaded from disk
  // and reloaded by the watcher: this surface is read-only, and a document
  // whose tests fail is data, not an RPC error.
  rpc GetPolicyStatus(GetPolicyStatusRequest) returns (PolicyStatus);

  // ListSSHCheckSessions returns the Tailscale SSH "check" authorizations of
  // this organization (GET /api/v2/ssh-check/sessions), newest first and
  // resumable with page_token. Read-only: verdicts are only made on the
  // browser approval page, and state is derived from the durable record.
  rpc ListSSHCheckSessions(ListSSHCheckSessionsRequest) returns (ListSSHCheckSessionsResponse);

  // GetMachineDeviceAttrs returns the device posture attributes a machine
  // reported about itself (PATCH /machine/set-device-attr). Values are the
  // JSON scalars the node sent. Another organization's machine is NOT_FOUND.
  rpc GetMachineDeviceAttrs(GetMachineDeviceAttrsRequest) returns (MachineDeviceAttrs);

  // ListMachines returns machines ordered by id, resumable with page_token.
  rpc ListMachines(ListMachinesRequest) returns (ListMachinesResponse);

  // ListServices returns the services nodes advertise about themselves
  // (Xunara Atlas), ordered by name and resumable with page_token. Publishing
  // happens over the native client protocol; this surface is read-only.
  rpc ListServices(ListServicesRequest) returns (ListServicesResponse);

  // ListFluxTransfers returns the file transfers of this organization
  // (Xunara Flux), newest first and resumable with page_token. It is the
  // read-only management surface: content is end-to-end encrypted and never
  // readable here, no message carries file content or key material, and there
  // is no download RPC. Flux must be enabled, otherwise NOT_FOUND.
  rpc ListFluxTransfers(ListFluxTransfersRequest) returns (ListFluxTransfersResponse);

  // GetFluxTransfer returns one transfer's metadata by ID. An unknown
  // transfer is NOT_FOUND, and Flux being disabled is NOT_FOUND too.
  rpc GetFluxTransfer(GetFluxTransferRequest) returns (FluxTransfer);

  // ListReachSessions returns the remote command sessions of this
  // organization (Xunara Reach), newest first and resumable with page_token.
  // The surface is read-only: sessions are created and driven by the two
  // agents. argv is included (the management plane may see it); output content
  // stays on the HTTP chunks endpoint.
  rpc ListReachSessions(ListReachSessionsRequest) returns (ListReachSessionsResponse);

  // GetReachSession returns one session by ID. An unknown session is
  // NOT_FOUND, and it is a 404/NOT_FOUND on every management endpoint when
  // Reach is not enabled.
  rpc GetReachSession(GetReachSessionRequest) returns (ReachSession);

  // ListAudit returns audit events ordered by id, resumable with page_token.
  rpc ListAudit(ListAuditRequest) returns (ListAuditResponse);

  // ListWebhooks returns the configured and managed webhook receivers. The
  // signing secret is write-only material and is never returned.
  rpc ListWebhooks(ListWebhooksRequest) returns (ListWebhooksResponse);

  // RevokeAgentToken signs a native client out. Revoking twice succeeds; an
  // unknown credential is NOT_FOUND.
  rpc RevokeAgentToken(RevokeAgentTokenRequest) returns (RevokeAgentTokenResponse);
}

message GetMetaRequest {}

// Meta mirrors GET /api/v2/meta. The boolean fields report whether an
// optional capability is enabled; they never carry secrets or endpoint
// detail. webhooks_enabled means at least one receiver would accept
// deliveries (configured or enabled managed endpoint).
message Meta {
  string version = 1;
  string server_url = 2;
  string domain = 3;
  uint64 capability_version = 4;
  uint64 min_capability_version = 5;
  uint32 max_page_size = 6;
  repeated string identity_providers = 7;
  uint32 agent_protocol_version = 8;
  bool webhooks_enabled = 9;
  bool dns_provider_configured = 10;
  repeated string cert_domains = 11;
  bool derp_map_configured = 12;
  string derp_policy = 13;
  uint32 derp_regions_served = 14;
  bool identity_tokens_enabled = 15;
  bool reach_enabled = 16;
  bool flux_enabled = 17;
  bool passkeys_enabled = 18;
  // sharing_enabled reports whether cross-organization machine sharing is
  // available: the platform share registry is open and a router hosts the
  // organizations (PROJECT_SPEC section 38.2).
  bool sharing_enabled = 19;
}

message GetOrganizationIdentityRequest {}

// OrganizationIdentity mirrors GET /api/v2/organization. It never carries
// secrets.
message OrganizationIdentity {
  // Id is the platform organization ID; empty for a single-tenant
  // deployment that has no organization table.
  string id = 1;
  string name = 2;
  // Domains are the routing domains (Host patterns) this organization
  // answers; never nil over HTTP, empty for a single-tenant deployment.
  repeated string domains = 3;
  // Managed is true when the platform registry owns the lifecycle of this
  // organization (it can be updated or deleted through PlatformAdminService).
  bool managed = 4;
  string magic_dns_domain = 5;
  string server_url = 6;
}

message GetTailnetLockRequest {}

// TailnetLockStatus mirrors GET /api/v2/tka.
message TailnetLockStatus {
  bool ever_enabled = 1;
  bool enabled = 2;
  bool disabled = 3;
  // Head is the current head AUM hash; empty unless enabled.
  string head = 4;
  TailnetLockNodeCounts nodes = 5;
}

// TailnetLockNodeCounts counts registered nodes and how many of them are
// signed.
message TailnetLockNodeCounts {
  uint32 total = 1;
  uint32 signed = 2;
  uint32 unsigned = 3;
}

message GetIDTokenIssuerRequest {}

// IDTokenIssuerStatus mirrors GET /api/v2/id-token.
message IDTokenIssuerStatus {
  // Enabled is false when the deployment has no issuer URL, in which case
  // /machine/id-token answers 501 and the keys are empty.
  bool enabled = 1;
  // Issuer is the value of a token's iss claim, and the base of jwks_url.
  string issuer = 2;
  string jwks_url = 3;
  // Algorithm is the JWS algorithm of every issued token.
  string algorithm = 4;
  // TokenTTLSeconds is how long an issued token is valid.
  int64 token_ttl_seconds = 5;
  // ActiveKeyID is the kid signing new tokens; empty when no key exists yet.
  string active_key_id = 6;
  // Keys are the keys published in the JWKS, newest last. Retired keys stay
  // published until the tokens they signed have expired.
  repeated IDTokenSigningKey keys = 7;
}

message IDTokenSigningKey {
  string kid = 1;
  google.protobuf.Timestamp created = 2;
  // Retired is set once the key stopped signing; an absent value means the
  // key is active.
  google.protobuf.Timestamp retired = 3;
}

message GetDERPStatusRequest {}

// DERPStatus mirrors GET /api/v2/derp. Both "no map configured" and "a map
// that serves nothing" report regions_served == 0; map_configured tells them
// apart, because clients treat the two differently.
message DERPStatus {
  // PolicyMode is inherit, none or regions.
  string policy_mode = 1;
  // PolicyRegions is the allowlist in regions mode; empty otherwise.
  repeated int32 policy_regions = 2;
  bool map_configured = 3;
  uint32 regions_served = 4;
  // Regions are the regions actually served, ordered by ID.
  repeated DERPRegion regions = 5;
  // NodesWithoutHome counts machines that have not chosen a home region.
  uint32 nodes_without_home = 6;
  // NodesWithUnservedHome counts machines still homed to a region the served
  // map no longer contains; their next map request re-homes them.
  uint32 nodes_with_unserved_home = 7;
}

message DERPRegion {
  int32 id = 1;
  string code = 2;
  string name = 3;
  // Hosts are the relay host:port entries of the region (public).
  repeated string hosts = 4;
  // NodeCount is how many machines are homed here.
  uint32 node_count = 5;
}

message GetPolicyStatusRequest {}

// PolicyStatus mirrors GET /api/v2/policy. Sections other than the counters
// are empty when configured is false: the deployment has no policy document,
// and every machine may reach every other machine.
message PolicyStatus {
  bool configured = 1;
  // path is the local document path.
  string path = 2;
  // rule_count is the compiled rule total (ACLs plus grants).
  uint32 rule_count = 3;
  // warnings are non-fatal compile problems; unsupported lists top-level
  // fields this build understands but ignores (ignoring can only tighten the
  // policy, never widen it).
  repeated string warnings = 4;
  repeated string unsupported = 5;
  // load_error is set when the file on disk no longer parses; the sections
  // still describe the document in force.
  string load_error = 6;
  repeated PolicyACLRule acls = 7;
  repeated PolicyGrant grants = 8;
  // groups, hosts and tag_owners mirror the document's maps; StringList is
  // the repeated-value type proto3 maps cannot express directly.
  map<string, StringList> groups = 9;
  map<string, string> hosts = 10;
  map<string, StringList> tag_owners = 11;
  repeated PolicySSHRule ssh = 12;
  repeated PolicyNodeAttr node_attrs = 13;
  PolicyTestSummary tests = 14;
}

// PolicyACLRule is one acls row as written in the document.
message PolicyACLRule {
  string action = 1;
  string proto = 2;
  repeated string src = 3;
  repeated string dst = 4;
  // users and ports are the pre-v2 names of src and dst.
  repeated string users = 5;
  repeated string ports = 6;
}

// PolicyGrant is one grants (ACL v2) row as written.
message PolicyGrant {
  repeated string src = 1;
  repeated string dst = 2;
  repeated string ip = 3;
  // app maps a peer capability to its JSON values, each encoded as JSON text.
  map<string, StringList> app = 4;
  repeated string via = 5;
}

// PolicySSHRule is one ssh row.
message PolicySSHRule {
  string action = 1;
  repeated string src = 2;
  repeated string dst = 3;
  repeated string users = 4;
  repeated string accept_env = 5;
  // check_period is "always", a Go duration string such as "12h0m0s", or
  // empty when the row did not set one (the 12h default).
  string check_period = 6;
}

// PolicyNodeAttr is one nodeAttrs row.
message PolicyNodeAttr {
  repeated string target = 1;
  repeated string attr = 2;
}

// PolicyTestSummary reports the document's own assertions against the current
// machines. ran is false when nothing ran; reason says why.
message PolicyTestSummary {
  uint32 total = 1;
  bool ran = 2;
  string reason = 3;
  repeated PolicyTestResult results = 4;
}

message PolicyTestResult {
  uint32 index = 1;
  string src = 2;
  string proto = 3;
  bool pass = 4;
  repeated string failures = 5;
}

message Machine {
  uint64 id = 1;
  string stable_id = 2;
  string hostname = 3;
  uint64 user_id = 4;
  string user_login_name = 5;
  bool online = 6;
  bool ephemeral = 7;
  bool expired = 8;
  string method = 9;
  string ipv4 = 10;
  string ipv6 = 11;
  google.protobuf.Timestamp created = 12;
  google.protobuf.Timestamp last_seen = 13;
  repeated string tags = 14;
  repeated string approved_routes = 15;
  repeated string announced_routes = 16;
  bool exit_node = 17;
  // device_attr_count is how many device posture attributes the machine has
  // reported; the values themselves come from GetMachineDeviceAttrs.
  uint32 device_attr_count = 18;
  // service_count is how many services the machine advertises; the records
  // themselves come from ListServices.
  uint32 service_count = 19;
}

message GetMachineDeviceAttrsRequest {
  uint64 machine_id = 1;
}

// MachineDeviceAttrs mirrors GET /api/v2/machines/{id}/device-attrs. The map
// is empty (not absent) for a machine that never reported an attribute.
message MachineDeviceAttrs {
  uint64 machine_id = 1;
  string stable_id = 2;
  map<string, google.protobuf.Value> attrs = 3;
}

// ReachSession mirrors GET /api/v2/reach/sessions/{id} (and the agent's
// session view). argv is the command the target approved; output content is
// not part of this message.
message ReachSession {
  string id = 1;
  string state = 2;
  ReachPeer sender = 3;
  ReachPeer target = 4;
  repeated string argv = 5;
  uint32 timeout_seconds = 6;
  // exit_code is absent until the command finished.
  optional int32 exit_code = 7;
  string error = 8;
  google.protobuf.Timestamp created = 9;
  google.protobuf.Timestamp updated = 10;
  google.protobuf.Timestamp expires = 11;
  ReachOutputBytes output_bytes = 12;
}

// ReachPeer identifies one participant of a session.
message ReachPeer {
  uint64 node_id = 1;
  string stable_id = 2;
  string hostname = 3;
}

// ReachOutputBytes counts a session's output per stream without carrying it.
message ReachOutputBytes {
  int64 stdout = 1;
  int64 stderr = 2;
}

message ListReachSessionsRequest {
  // page_size defaults to 100 and is bounded by Meta.max_page_size.
  uint32 page_size = 1;
  // page_token is the next_page_token of the previous response.
  string page_token = 2;
  // state filters on a session state (offered, accepted, running, succeeded,
  // failed, denied, canceled, expired); an unknown value is INVALID_ARGUMENT.
  string state = 3;
  // node filters on a node id or stable ID; an unknown node matches nothing.
  string node = 4;
}

message ListReachSessionsResponse {
  repeated ReachSession sessions = 1;
  string next_page_token = 2;
}

message FluxPeer {
  uint64 node_id = 1;
  string stable_id = 2;
  string hostname = 3;
}

// FluxTransfer mirrors GET /api/v2/flux/transfers items. It never carries
// content, the recipient's per-transfer public key or a content path.
message FluxTransfer {
  string id = 1;
  string state = 2;
  // Name and size are the plaintext name/size the sender proposed; the
  // stored ciphertext is not described here.
  string name = 3;
  int64 size = 4;
  string sha256 = 5;
  FluxPeer sender = 6;
  FluxPeer recipient = 7;
  // Reason is the static explanation of a denial or failure; empty
  // otherwise.
  string reason = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  google.protobuf.Timestamp expires_at = 11;
}

message ListFluxTransfersRequest {
  // State filters by transfer state; empty means all. An unknown state is
  // INVALID_ARGUMENT.
  string state = 1;
  // Node filters by node id or stable ID; an unknown node matches nothing.
  string node = 2;
  uint32 page_size = 3;
  string page_token = 4;
}

message ListFluxTransfersResponse {
  repeated FluxTransfer transfers = 1;
  string next_page_token = 2;
}

message SSHCheckPeer {
  int64 node_id = 1;
  // stable_id and hostname are absent when the node row is gone; the ID is
  // still the ID the session is bound to.
  string stable_id = 2;
  string hostname = 3;
}

message SSHCheckDecider {
  uint64 user_id = 1;
  string login_name = 2;
}

message SSHCheckSession {
  string id = 1;
  // state is the derived lifecycle state: pending, expired, consumed,
  // accepted or rejected.
  string state = 2;
  // verdict is the raw decision: pending, accept or reject. It stays
  // distinguishable from state because "consumed" hides the direction.
  string verdict = 3;
  SSHCheckPeer src = 4;
  SSHCheckPeer dst = 5;
  string local_user = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp expires_at = 8;
  // decided_at/decided_by and consumed_at are absent until the session is
  // decided and consumed respectively.
  google.protobuf.Timestamp decided_at = 9;
  SSHCheckDecider decided_by = 10;
  google.protobuf.Timestamp consumed_at = 11;
}

message ListSSHCheckSessionsRequest {
  uint32 page_size = 1;
  string page_token = 2;
  // state filters by derived lifecycle state; an unknown value is invalid.
  string state = 3;
  // node filters by either end: a node ID or a stable ID.
  string node = 4;
}

message ListSSHCheckSessionsResponse {
  repeated SSHCheckSession sessions = 1;
  string next_page_token = 2;
}

message GetFluxTransferRequest {
  string id = 1;
}

message GetReachSessionRequest {
  string id = 1;
}

message ListMachinesRequest {
  // page_size defaults to 50 and is bounded by Meta.max_page_size.
  uint32 page_size = 1;
  // page_token is the next_page_token of the previous response.
  string page_token = 2;
  // state filters on "online" or "offline"; empty means both.
  string state = 3;
  // user filters on a user id or login name; an unknown user matches nothing.
  string user = 4;
  // tag filters on a node tag (for example "tag:server").
  string tag = 5;
}

message ListMachinesResponse {
  repeated Machine machines = 1;
  string next_page_token = 2;
}

message ListServicesRequest {
  // page_size defaults to 100 and is bounded by Meta.max_page_size.
  uint32 page_size = 1;
  // page_token is the next_page_token of the previous response.
  string page_token = 2;
  // node_id filters on the advertising machine; an absent value means every
  // machine, while 0 (not a node ID) or an unknown id matches nothing. The
  // field is optional so "unset" and "0" stay distinguishable.
  optional uint64 node_id = 3;
  // name filters on one exact service name.
  string name = 4;
}

message ListServicesResponse {
  repeated Service services = 1;
  string next_page_token = 2;
}

// Service is one endpoint a node advertises about itself. Discovery is not
// authorization: reachability is still decided by the ACL rules.
message Service {
  string name = 1;
  string protocol = 2;
  uint32 port = 3;
  map<string, string> metadata = 4;
  uint64 machine_id = 5;
  string stable_id = 6;
  string hostname = 7;
  // dns_name is the MagicDNS name the service resolves under; empty when the
  // deployment has no domain configured.
  string dns_name = 8;
  google.protobuf.Timestamp created = 9;
  google.protobuf.Timestamp updated = 10;
  // health is "healthy" or "unhealthy" for services whose declaration opted
  // into readiness reporting; it is empty for untracked services, which are
  // always discoverable. Unhealthy services are withdrawn from MagicDNS.
  string health = 11;
  // health_reported_at is when the node last reported readiness; unset when
  // it never did.
  google.protobuf.Timestamp health_reported_at = 12;
  // visibility lists the selectors that may discover the service through
  // MagicDNS; ["*"] is the default (the whole organization). It narrows
  // discovery only: the ACL rules still decide who may connect.
  repeated string visibility = 13;
  // shared reports whether the service is projected into the MagicDNS of
  // organizations whose users accepted a share of the advertising node.
  // Projected records resolve to the consumer's masquerade address for the
  // machine; reachability is still decided by ACL rules alone.
  bool shared = 14;
  // visibility_from_acl reports whether discovery is derived from the ACL
  // instead of the selector list: the service is discoverable exactly by the
  // nodes whose packet filter lets them connect on its protocol and port.
  // Mutually exclusive with a non-default visibility list.
  bool visibility_from_acl = 15;
}

message AuditEvent {
  uint64 id = 1;
  google.protobuf.Timestamp time = 2;
  string actor = 3;
  string action = 4;
  string target = 5;
  string detail = 6;
}

message ListAuditRequest {
  // page_size defaults to 100 and is bounded by Meta.max_page_size.
  uint32 page_size = 1;
  string page_token = 2;
  // action filters on the audit action (exact match).
  string action = 3;
  // actor filters on the actor (exact match).
  string actor = 4;
  // target filters on a target prefix.
  string target = 5;
}

message ListAuditResponse {
  repeated AuditEvent events = 1;
  string next_page_token = 2;
}

message Webhook {
  string id = 1;
  string url = 2;
  repeated string events = 3;
  bool enabled = 4;
  // source is "config" for deployment-configured receivers and "managed" for
  // ones created through the API.
  string source = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message ListWebhooksRequest {}

message ListWebhooksResponse {
  repeated Webhook webhooks = 1;
}

message RevokeAgentTokenRequest {
  string id = 1;
}

message RevokeAgentTokenResponse {
  string id = 1;
  bool revoked = 2;
}

// PlatformAdminService is the deployment-level automation surface. It mirrors
// the /api/platform/v1 HTTP API and is authorized by the process-level platform
// admin token only; an organization's own credentials (session or API key)
// never reach it, because that would cross tenant boundaries. The service is
// available in multi-tenant deployments that configure a platform token.
service PlatformAdminService {
  // ListOrganizations returns every hosted organization with a status summary.
  rpc ListOrganizations(ListOrganizationsRequest) returns (ListOrganizationsResponse);

  // GetOrganization returns one organization by ID.
  rpc GetOrganization(GetOrganizationRequest) returns (Organization);

  // CreateOrganization creates a platform-managed organization.
  rpc CreateOrganization(CreateOrganizationRequest) returns (Organization);

  // UpdateOrganization renames or retargets a managed organization. Configured
  // organizations are read-only.
  rpc UpdateOrganization(UpdateOrganizationRequest) returns (Organization);

  // DeleteOrganization archives and removes a managed organization. Deleting
  // twice reports NOT_FOUND; the organzation's configured peers are untouched.
  rpc DeleteOrganization(DeleteOrganizationRequest) returns (DeleteOrganizationResponse);

  // ListAudit exports the audit logs of every hosted organization as one
  // resumable, time-ordered stream. Pagination is per organization (each has
  // its own ID space), so callers keep the returned cursors and hand them back
  // on the next call.
  rpc ListAudit(ListPlatformAuditRequest) returns (ListPlatformAuditResponse);
}

message Organization {
  string id = 1;
  string name = 2;
  repeated string domains = 3;
  OrganizationStats stats = 4;
  // managed is true for organizations created through the platform API.
  // Configured organizations are read-only.
  bool managed = 5;
}

message OrganizationStats {
  uint64 nodes = 1;
  uint64 online = 2;
  uint64 users = 3;
  uint64 pending_devices = 4;
  bool policy_loaded = 5;
}

message ListOrganizationsRequest {}

message ListOrganizationsResponse {
  repeated Organization organizations = 1;
}

message GetOrganizationRequest {
  string id = 1;
}

message CreateOrganizationRequest {
  // id is the stable identifier; it cannot be changed later.
  string id = 1;
  string name = 2;
  // domains are the login-server host names routed to this organization.
  repeated string domains = 3;
  string server_url = 4;
  // domain is the organization's MagicDNS domain; empty disables MagicDNS.
  string domain = 5;
}

// StringList gives a repeated field the presence a proto3 field otherwise
// lacks, so an update can tell "leave unchanged" from "set to empty".
message StringList {
  repeated string values = 1;
}

message UpdateOrganizationRequest {
  string id = 1;
  // name, when set, renames the organization.
  optional string name = 2;
  // domains, when set, replaces the domain list. ID, server_url and the
  // MagicDNS domain cannot be changed: clients are configured with the
  // organization's URL.
  optional StringList domains = 3;
}

message DeleteOrganizationRequest {
  string id = 1;
}

message DeleteOrganizationResponse {
  string id = 1;
  bool deleted = 2;
  // archived_at names where the organization's state directory was archived;
  // the same value the HTTP API calls archivedAt.
  string archived_at = 3;
}

message PlatformAuditEvent {
  string org = 1;
  uint64 id = 2;
  google.protobuf.Timestamp time = 3;
  string actor = 4;
  string action = 5;
  string target = 6;
  string detail = 7;
}

message ListPlatformAuditRequest {
  // orgs selects organizations to export; empty means every organization.
  repeated string orgs = 1;
  // cursors are "org:id" pairs: the last event ID already consumed per
  // organization. Unknown organizations and malformed pairs are rejected.
  repeated string cursors = 2;
  // actions filters on audit action globs ("*" is the only wildcard). An empty
  // filter matches every action.
  repeated string actions = 3;
  // limit bounds how many raw events one organization is scanned for; it
  // defaults to 500 and is capped at 2000.
  uint32 limit = 4;
}

message ListPlatformAuditResponse {
  repeated PlatformAuditEvent events = 1;
  // cursors are the next "org:id" positions, one per exported organization.
  map<string, uint64> cursors = 2;
  bool has_more = 3;
}
