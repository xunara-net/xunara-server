name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1
      - name: Race
        # 整包包含大量真实密码哈希和协议回归，竞态插桩后不能沿用默认十分钟预算。
        run: go test -race ./... -count=1 -timeout=30m
  sharing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: integration/sharing/go.mod
          cache-dependency-path: |
            go.sum
            integration/sharing/go.sum
      - name: Official client sharing over overlapping networks
        working-directory: integration/sharing
        run: go test -race . -count=1 -timeout=4m
